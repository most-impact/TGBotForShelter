databaseChangeLog:
  - changeSet:
      id: 1
      author: developer
      changes:
        - createTable:
            tableName: shelters
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: schedule
                  type: VARCHAR(1000)
              - column:
                  name: security_contact
                  type: VARCHAR(255)
              - column:
                  name: safety_rules
                  type: VARCHAR(2000)
              - column:
                  name: information
                  type: VARCHAR(2000)

  - changeSet:
      id: 2
      author: developer
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: telegram_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: phone_number
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: registered_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: is_volunteer
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 3
      author: developer
      changes:
        - createTable:
            tableName: pets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: breed
                  type: VARCHAR(255)
              - column:
                  name: age
                  type: INT
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: has_disabilities
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 4
      author: developer
      changes:
        - createTable:
            tableName: adopters
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: shelter_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: pet_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: adoption_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: adopters
            baseColumnNames: user_id
            constraintName: fk_adopters_users
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: adopters
            baseColumnNames: shelter_id
            constraintName: fk_adopters_shelters
            referencedTableName: shelters
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: adopters
            baseColumnNames: pet_id
            constraintName: fk_adopters_pets
            referencedTableName: pets
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 5
      author: developer
      changes:
        - createTable:
            tableName: trial_periods
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: adopter_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: missed_reports
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: trial_periods
            baseColumnNames: adopter_id
            constraintName: fk_trial_periods_adopters
            referencedTableName: adopters
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 6
      author: developer
      changes:
        - createTable:
            tableName: daily_reports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trial_period_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: report_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: photo_path
                  type: VARCHAR(500)
              - column:
                  name: diet
                  type: VARCHAR(1000)
              - column:
                  name: well_being
                  type: VARCHAR(1000)
              - column:
                  name: behavior_changes
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: reviewed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: poor_quality
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: daily_reports
            baseColumnNames: trial_period_id
            constraintName: fk_daily_reports_trial_periods
            referencedTableName: trial_periods
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: daily_reports
            columnNames: trial_period_id, report_date
            constraintName: uk_trial_period_report_date
